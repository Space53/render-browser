<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Browser Pro - Real-time</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="app">
        <!-- Верхняя панель -->
        <header class="top-bar">
            <h1>🌐 Sync Browser Pro</h1>
            <div class="status-badge" id="connectionStatus">
                🔴 Подключение...
            </div>
        </header>
        
        <!-- Панель управления -->
        <div class="control-bar">
            <button class="btn btn-primary" onclick="createNewWindow()">
                ➕ Новое окно
            </button>
            <button class="btn btn-success" onclick="startAllAutoScroll()">
                ▶ Анти-кик ВСЕ
            </button>
            <button class="btn btn-danger" onclick="stopAllAutoScroll()">
                ⏹ Стоп ВСЕ
            </button>
            <button class="btn btn-purple" onclick="refreshAll()">
                🔄 Обновить ВСЕ
            </button>
            <span class="separator">|</span>
            <span id="windowsCount">Окна: 0</span>
        </div>
        
        <!-- Сетка браузеров -->
        <div class="browsers-grid" id="browsersGrid">
            <div class="loading-screen">
                <div class="spinner"></div>
                <p>Запуск браузеров...</p>
                <p class="sub">Ожидайте, создаются окна Chromium</p>
            </div>
        </div>
    </div>
    
    <script src="client.js"></script>
</body>
</html>
