<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Browser Pro</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="app">
        <!-- ========== БОКОВАЯ ПАНЕЛЬ ========== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>🖥️ Окна</h2>
                <button class="btn-icon" onclick="toggleSidebar()">◀</button>
            </div>
            
            <div class="windows-list" id="windowsList">
                <!-- Динамически заполняется -->
            </div>
            
            <div class="sidebar-footer">
                <button class="btn btn-primary" onclick="addNewWindow()">
                    ➕ Добавить окно
                </button>
            </div>
        </aside>
        
        <!-- ========== ОСНОВНАЯ ОБЛАСТЬ ========== -->
        <main class="main-content" id="mainContent">
            <!-- Верхняя панель -->
            <header class="top-bar">
                <button class="btn-icon" onclick="toggleSidebar()">☰</button>
                <span class="top-title" id="currentViewTitle">Все окна</span>
                <div class="top-actions">
                    <button class="btn btn-sm" onclick="refreshAll()">🔄 Обновить все</button>
                    <button class="btn btn-sm btn-success" onclick="startAllAutoScroll()">▶ Анти-кик все</button>
                    <button class="btn btn-sm btn-danger" onclick="stopAllAutoScroll()">⏹ Стоп все</button>
                </div>
            </header>
            
            <!-- Сетка окон -->
            <div class="windows-grid" id="windowsGrid">
                <!-- Динамически заполняется -->
            </div>
            
            <!-- Фулскрин режим -->
            <div class="fullscreen-view hidden" id="fullscreenView">
                <div class="fullscreen-header">
                    <button class="btn-icon" onclick="exitFullscreen()">✕ Закрыть</button>
                    <span id="fullscreenTitle">Окно</span>
                    <div class="fullscreen-url">
                        <input type="text" id="fullscreenUrlInput" placeholder="URL">
                        <button class="btn btn-sm" onclick="navigateFullscreen()">Перейти</button>
                    </div>
                </div>
                <div class="fullscreen-content" id="fullscreenContent"></div>
            </div>
        </main>
        
        <!-- ========== ПАНЕЛЬ КЛИКЕРОВ ========== -->
        <aside class="clickers-panel" id="clickersPanel">
            <div class="panel-header">
                <h3>🤖 Кликеры</h3>
            </div>
            <div class="clickers-list" id="clickersList"></div>
            <div class="panel-footer">
                <select id="clickerTypeSelect">
                    <option value="click">🖱️ Клик</option>
                    <option value="scroll">👆 Скролл</option>
                    <option value="refresh">🔄 Рефреш</option>
                    <option value="hover">👉 Ховер</option>
                    <option value="type">⌨️ Ввод</option>
                </select>
                <select id="clickerWindowSelect"></select>
                <input type="number" id="clickerInterval" value="5000" placeholder="Интервал (мс)">
                <button class="btn btn-purple btn-sm" onclick="addClickerToWindow()">Добавить</button>
            </div>
        </aside>
    </div>
    
    <script src="client.js"></script>
</body>
</html>
