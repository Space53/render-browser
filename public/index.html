<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Live Browser Pro X</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="data:application/manifest+json,{}">
    <meta name="theme-color" content="#0a0a1a">
</head>
<body>
    <div id="app">
        <header class="top-bar">
            <button class="icon-btn" id="btnSidebar">☰</button>
            <h1>🌐 Live Browser</h1>
            <div class="spacer"></div>
            <span id="fpsCounter" class="badge fps">0 FPS</span>
            <button class="icon-btn" id="btnSettings">⚙️</button>
            <div class="account-badge" id="accountBadge">👤 <span id="currentAccountId">0</span></div>
        </header>

        <!-- Боковая панель -->
        <aside id="sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <h2>📑 Окна и закладки</h2>
                <button class="icon-btn" id="closeSidebar">✕</button>
            </div>
            <div class="sidebar-section">
                <h3>🖥️ Мои окна</h3>
                <div id="windowList" class="list"></div>
                <button id="btnAddWindowSidebar" class="btn primary full-width">➕ Новое окно</button>
            </div>
            <div class="sidebar-section">
                <h3>⭐ Закладки</h3>
                <div id="bookmarkList" class="list"></div>
            </div>
        </aside>

        <!-- Сетка браузеров -->
        <main class="browsers-grid" id="browsersGrid">
            <div class="loading-center"><div class="spinner"></div><p>Запуск окружения...</p></div>
        </main>

        <!-- Нижняя панель инструментов -->
        <footer class="toolbar" id="toolbar">
            <button class="icon-btn" id="btnBack">◀</button>
            <button class="icon-btn" id="btnForward">▶</button>
            <button class="icon-btn" id="btnRefresh">↻</button>
            <button class="icon-btn" id="btnScroll">↓</button>
            <button class="icon-btn" id="btnAutoScroll">🛡️</button>
            <button class="icon-btn" id="btnType">✏️</button>
            <button class="icon-btn" id="btnScreenshot">📸</button>
            <button class="icon-btn" id="btnClose" style="color:#e94560;">✕</button>
        </footer>

        <!-- Модалки -->
        <div id="settingsModal" class="modal hidden">
            <div class="modal-content">
                <h3>⚙️ Настройки</h3>
                <label>ID аккаунта: <input type="number" id="accountIdInput" value="0" min="0" max="9999"></label>
                <button class="btn primary" id="btnChangeAccount">🔄 Сменить</button>
                <button class="btn" id="btnShowLogs">📋 Журнал событий</button>
                <p class="hint">Одинаковый ID = общие окна.</p>
                <button class="btn" id="btnCloseSettings">Закрыть</button>
            </div>
        </div>

        <div id="logsModal" class="modal hidden">
            <div class="modal-content wide">
                <h3>📋 Live Logs</h3>
                <div id="logContainer" class="log-container">Загрузка...</div>
                <button class="btn" id="btnCloseLogs">Закрыть</button>
            </div>
        </div>

        <div id="mobileKeyboard" class="mobile-keyboard hidden">
            <input type="text" id="mobileInput" placeholder="Текст..." autocomplete="off">
            <button id="btnSendMobile">➤</button>
            <button id="btnHideKeyboard">✕</button>
        </div>
    </div>
    <script src="client.js"></script>
</body>
</html>
