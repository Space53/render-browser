<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live Browser</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="top-bar">
            <h1>🌐 Live Browser</h1>
            <span id="fps">30 FPS</span>
        </header>
        
        <div class="control-bar">
            <button class="btn btn-primary" onclick="createNewWindow()">➕ Окно</button>
            <span id="windowsCount">Окна: 0</span>
            <span class="hint">👆 Кликайте, скролльте, вводите текст прямо на сайтах!</span>
        </div>
        
        <div class="browsers-grid" id="browsersGrid">
            <div class="loading-screen">
                <div class="spinner"></div>
                <p>Запуск браузеров...</p>
            </div>
        </div>
        
        <!-- Клавиатура для телефона -->
        <div id="mobileKeyboard" class="mobile-keyboard hidden">
            <input type="text" id="mobileInput" placeholder="Введите текст..." autocomplete="off" />
            <button onclick="sendMobileText()">➤</button>
            <button onclick="hideMobileKeyboard()">✕</button>
        </div>
    </div>
    
    <script src="client.js"></script>
</body>
</html>
